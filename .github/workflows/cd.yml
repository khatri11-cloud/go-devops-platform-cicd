name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

jobs:
  deploy:
    name: Build and Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/devops-platform:latest \
            ./app

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.ACR_LOGIN_SERVER }}/devops-platform:latest

      - name: Delete Existing Azure Container Instance
        run: |
          az container delete \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_CONTAINER_NAME }} \
            --yes

      - name: Create Azure Container Instance
        run: |
          az container create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_CONTAINER_NAME }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/devops-platform:latest \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label ${{ vars.AZURE_DNS_LABEL }} \
            --ports 8080 \
            --cpu 1 \
            --memory 1 \
            --os-type Linux \
            --location ${{ vars.AZURE_LOCATION }} \
            --environment-variables APP_VERSION=1.0.0

      - name: Wait for Container to Start
        run: sleep 30

      - name: Verify Deployment
        run: |
          curl --fail http://${{ vars.AZURE_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.azurecontainer.io:8080/health