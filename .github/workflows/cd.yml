name: Continuous Deployment

on:
  workflow_run:
    workflows: ["Continuous Integration"]
    types:
      - completed

jobs:
  deploy:
    name: Build and Deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: devops-platform
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # Set up Docker Buildx to enable advanced caching and BuildKit features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Combined build, tag, and push using Buildx
      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Delete Existing Azure Container Instance
        run: |
          az container delete \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_CONTAINER_NAME }} \
            --yes

      - name: Create Azure Container Instance
        run: |
          az container create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --name ${{ vars.AZURE_CONTAINER_NAME }} \
            --image ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --registry-login-server ${{ secrets.ACR_LOGIN_SERVER }} \
            --registry-username ${{ secrets.ACR_USERNAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --dns-name-label ${{ vars.AZURE_DNS_LABEL }} \
            --ports 8080 \
            --cpu 1 \
            --memory 1 \
            --os-type Linux \
            --location ${{ vars.AZURE_LOCATION }} \
            --environment-variables APP_VERSION=${{ env.IMAGE_TAG }}

      # Fixed indentation error from original script
      - name: Wait for Application Health
        run: |
          URL="http://${{ vars.AZURE_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.azurecontainer.io:8080/health"
          
          echo "Waiting for application to become healthy..."
          
          for i in {1..24}; do
            if curl --silent --fail "$URL" > /dev/null; then
              echo "Application is healthy."
              exit 0
            fi
            
            echo "Attempt $i/24 - Application not ready yet..."
            sleep 5
          done
          
          echo "Deployment failed: Application never became healthy."
          exit 1

      - name: Deployment Summary
        run: |
          echo "Deployment completed successfully!"
          echo "Image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          echo "Application URL:"
          echo "http://${{ vars.AZURE_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.azurecontainer.io:8080"

      - name: Deployment Summary
        run: |
          {
            echo "## Deployment Successful"
            echo ""
            echo "| Item | Value |"
            echo "|------|-------|"
            echo "| Repository | ${{ github.repository }} |"
            echo "| Branch | ${{ github.ref_name }} |"
            echo "| Commit | ${{ github.sha }} |"
            echo "| Image | ${{ vars.AZURE_ACR_NAME }}.azurecr.io/devops-platform:${{ env.IMAGE_TAG }} |"
            echo "| Environment | Azure Container Instance |"
            echo "| URL | http://${{ vars.AZURE_DNS_LABEL }}.${{ vars.AZURE_LOCATION }}.azurecontainer.io:8080 |"
          } >> $GITHUB_STEP_SUMMARY

          